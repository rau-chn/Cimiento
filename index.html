<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315b52">
  <meta name="description" content="Cimiento: seguimiento personal de crecimiento espiritual.">
  <title>Cimiento</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Crecimiento espiritual</p>
      <h1>Cimiento</h1>
    </div>
    <button id="installButton" class="button ghost hidden" type="button">Instalar</button>
  </header>

  <div id="backupBanner" class="banner hidden" role="status"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <main class="shell">
    <section id="view-home" class="view active" data-view="home"></section>
    <section id="view-reading" class="view" data-view="reading"></section>
    <section id="view-prayer" class="view" data-view="prayer"></section>
    <section id="view-church" class="view" data-view="church"></section>
    <section id="view-study" class="view" data-view="study"></section>
    <section id="view-progress" class="view" data-view="progress"></section>
    <section id="view-settings" class="view" data-view="settings"></section>
  </main>

  <div id="moreMenu" class="more-menu" aria-label="Más secciones" hidden>
    <button type="button" data-nav="progress">Progreso</button>
    <button type="button" data-nav="study">Estudio personal</button>
    <button type="button" data-nav="settings">Ajustes</button>
  </div>
  <nav class="bottom-nav" aria-label="Navegación principal">
    <button class="nav-item active" data-nav="home">Hoy</button>
    <button class="nav-item" data-nav="reading">Lectura</button>
    <button class="nav-item" data-nav="prayer">Oración</button>
    <button class="nav-item" data-nav="church">Iglesia</button>
    <button class="nav-item" data-nav="progress">Progreso</button>
    <button class="nav-item" data-nav="study">Estudio</button>
    <button class="nav-item" data-nav="settings">Ajustes</button>
    <button id="moreButton" class="nav-item nav-more" type="button" aria-controls="moreMenu" aria-expanded="false">Más</button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
